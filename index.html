<html lang="ro">
<head>
<meta charset="utf-8">

<title>Fewa Restaurant · Meniu</title>
<meta name="description" content="Meniul Fewa Restaurant — bucătărie indiană și nepaleză. Indian &amp; Nepalese cuisine menu.">
<meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141010" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Fewa Restaurant · Meniu">
<meta property="og:description" content="Bucătărie indiană și nepaleză · Indian &amp; Nepalese cuisine">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23A32638'/%3E%3Ctext x='50' y='70' font-size='56' font-family='Georgia,serif' fill='%23FBF6EE' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --surface-2:#F4ECE0;
  --ink:#241812; --ink-2:#4A382C; --muted:#7D6B5D;
  --line:rgba(36,24,18,.10); --line-2:rgba(36,24,18,.06);
  --crimson:#A32638; --saffron:#C9761B;
  --veg:#2F7A43; --egg:#A8791A; --meat:#A32638;
  --shadow:0 1px 2px rgba(36,24,18,.05),0 8px 24px rgba(36,24,18,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141010; --surface:#1D1715; --surface-2:#262020;
    --ink:#F4EADC; --ink-2:#D8C9B8; --muted:#A3907F;
    --line:rgba(244,234,220,.13); --line-2:rgba(244,234,220,.07);
    --crimson:#E4687A; --saffron:#E8A24C;
    --veg:#6DC487; --egg:#E0B55A; --meat:#E4687A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141010; --surface:#1D1715; --surface-2:#262020;
  --ink:#F4EADC; --ink-2:#D8C9B8; --muted:#A3907F;
  --line:rgba(244,234,220,.13); --line-2:rgba(244,234,220,.07);
  --crimson:#E4687A; --saffron:#E8A24C;
  --veg:#6DC487; --egg:#E0B55A; --meat:#E4687A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:150px}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px}

/* hero */
.hero{
  position:relative; text-align:center; padding:40px 16px 30px;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(201,118,27,.14) 0%, transparent 62%),
    linear-gradient(180deg, rgba(163,38,56,.07), transparent 70%);
  border-bottom:1px solid var(--line);
}
.peaks{display:block; margin:0 auto 14px; width:84px; height:34px; color:var(--saffron)}
.hero h1{
  font-family:Fraunces,Georgia,serif; font-weight:700; margin:0;
  font-size:clamp(38px,13vw,62px); letter-spacing:.14em; line-height:1;
  color:var(--crimson); text-indent:.14em;
}
.hero .sub1{
  font-size:clamp(10px,3.1vw,13px); letter-spacing:.44em; text-indent:.44em;
  margin:10px 0 0; color:var(--ink-2); font-weight:600; text-transform:uppercase;
}
.rule{display:flex; align-items:center; justify-content:center; gap:10px; margin:16px auto 0; max-width:300px}
.rule i{flex:1; height:1px; background:var(--line); display:block}
.rule b{width:6px; height:6px; border-radius:50%; background:var(--saffron); flex:none}
.hero .sub2{margin:14px 0 0; font-family:Fraunces,Georgia,serif; font-size:17px; color:var(--ink-2)}
.hero .sub3{margin:3px 0 0; font-size:12px; color:var(--muted); letter-spacing:.12em}

/* sticky toolbar */
.bar{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line);
}
@supports (backdrop-filter:blur(1px)){
  .bar{background:rgba(251,246,238,.86); backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px)}
  :root[data-theme="dark"] .bar{background:rgba(20,16,16,.86)}
}
@media (prefers-color-scheme:dark){
  @supports (backdrop-filter:blur(1px)){
    :root:not([data-theme="light"]) .bar{background:rgba(20,16,16,.86)}
  }
}
.bar-top{display:flex; gap:8px; align-items:center; padding:10px 16px; max-width:720px; margin:0 auto}
.search{position:relative; flex:1; min-width:0}
.search > svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); pointer-events:none}
.search input{
  width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:9px 34px 9px 35px; font:inherit; font-size:15px; outline:none;
  -webkit-appearance:none; appearance:none;
}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--saffron); box-shadow:0 0 0 3px rgba(201,118,27,.2)}
.search .clr{
  position:absolute; right:5px; top:50%; transform:translateY(-50%); border:0; background:transparent;
  color:var(--muted); font-size:20px; line-height:1; cursor:pointer; padding:4px 8px; border-radius:50%; display:none;
}
.search.has .clr{display:block}
.iconbtn{
  flex:none; display:inline-flex; align-items:center; justify-content:center;
  height:38px; min-width:38px; padding:0 11px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; letter-spacing:.04em;
}
.iconbtn svg{width:17px; height:17px}
#lang{gap:4px; padding:0 12px}
#lang b{font-weight:700; color:var(--ink)}
#lang i{font-style:normal; opacity:.35}
#lang s{text-decoration:none; opacity:.45; font-weight:500}

.chips{display:flex; gap:7px; overflow-x:auto; padding:0 16px 9px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:6px 13px; font-size:13px; font-weight:500; cursor:pointer;
  white-space:nowrap; font-family:inherit; display:inline-flex; align-items:center; gap:6px;
}
.chip .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.chip[aria-pressed="true"], .chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip[data-diet="veg"]{color:var(--veg)}
.chip[data-diet="egg"]{color:var(--egg)}
.chip[data-diet="meat"]{color:var(--meat)}
.chip[data-diet][aria-pressed="true"]{color:var(--bg)}
.navchips{border-top:1px solid var(--line-2); padding-top:9px}

/* sections */
main{padding:24px 0 70px}
.sec{margin:0 0 36px; scroll-margin-top:154px}
.sec-head{text-align:center; margin:0 0 16px}
.sec-head h2{
  font-family:Fraunces,Georgia,serif; font-size:27px; font-weight:600; margin:0;
  color:var(--ink); letter-spacing:-.01em;
}
.sec-head p{margin:5px 0 0; font-size:12.5px; color:var(--muted); letter-spacing:.05em}
.sec-head .rule{margin-top:12px; max-width:150px}

.group{
  font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--saffron); margin:26px 0 11px; text-align:center;
}
.list{display:flex; flex-direction:column; gap:10px}
.item{
  background:var(--surface); border:1px solid var(--line-2); border-radius:var(--radius);
  padding:13px 15px; box-shadow:var(--shadow);
}
.item-top{display:flex; align-items:baseline; gap:9px}
.item.has-img{padding:11px 13px}
.item.has-img .item-top{align-items:flex-start}
.item.has-img .desc{padding-left:65px}

/* thumbnail */
.thumb{
  flex:none; width:56px; height:56px; border-radius:11px; padding:0; margin:0;
  border:1px solid var(--line-2); background:var(--surface-2); overflow:hidden;
  position:relative; cursor:zoom-in; display:block; -webkit-tap-highlight-color:transparent;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb::after{
  content:""; position:absolute; right:3px; bottom:3px; width:11px; height:11px;
  border-radius:3px; background:var(--surface); border:1.5px solid currentColor;
  box-shadow:0 0 0 1.5px var(--surface);
}
.thumb::before{
  content:""; position:absolute; right:6.2px; bottom:6.2px; width:4.6px; height:4.6px;
  border-radius:50%; background:currentColor; z-index:1;
}
.thumb[data-t="veg"]{color:var(--veg)}
.thumb[data-t="egg"]{color:var(--egg)}
.thumb[data-t="meat"]{color:var(--meat)}
.thumb:active{transform:scale(.97)}

/* preview */
.lb{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(18,12,10,.93); padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  align-items:center; justify-content:center;
}
.lb.open{display:flex}
.lb-box{max-width:520px; width:100%; max-height:100%; display:flex; flex-direction:column; gap:14px}
.lb-img{min-height:0; border-radius:16px; overflow:hidden; background:#241812; display:block}
.lb-img img{
  display:block; margin:0 auto; width:auto; height:auto;
  max-width:100%; max-height:62vh;
}
.lb-cap{color:#F4EADC; text-align:center; flex:none}
.lb-cap h4{
  margin:0; font-family:Fraunces,Georgia,serif; font-size:21px; font-weight:600;
  display:flex; align-items:baseline; justify-content:center; gap:9px; flex-wrap:wrap;
}
.lb-cap h4 span{font-family:Inter,sans-serif; font-size:12.5px; font-weight:400; opacity:.6}
.lb-cap .lb-price{color:#E4687A; font-family:Fraunces,Georgia,serif; font-size:19px; font-weight:600}
.lb-cap p{margin:7px auto 0; font-size:13.5px; line-height:1.5; color:#C3B2A2; max-width:420px}
.lb-close{
  position:fixed; top:calc(12px + env(safe-area-inset-top)); right:12px; z-index:101;
  width:42px; height:42px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(255,255,255,.14); color:#F4EADC; display:grid; place-items:center;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.lb-close svg{width:21px; height:21px}
body.lb-on{overflow:hidden}
.item-name{font-weight:600; font-size:16px; color:var(--ink); flex:1; min-width:0; margin:0; letter-spacing:-.005em}
.item-name .portion{font-weight:400; font-size:12.5px; color:var(--muted); white-space:nowrap}
.tagdot{
  flex:none; width:13px; height:13px; border-radius:3px; border:1.5px solid currentColor;
  display:inline-grid; place-items:center; position:relative; top:1px;
}
.tagdot::after{content:""; width:5px; height:5px; border-radius:50%; background:currentColor}
.tagdot[data-t="veg"]{color:var(--veg)}
.tagdot[data-t="egg"]{color:var(--egg)}
.tagdot[data-t="meat"]{color:var(--meat)}
.price{
  flex:none; font-family:Fraunces,Georgia,serif; font-weight:600; font-size:16.5px;
  color:var(--crimson); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.price small{font-size:11px; font-weight:400; color:var(--muted); font-family:Inter,sans-serif; margin-left:3px}
.desc{margin:6px 0 0; font-size:13.5px; line-height:1.48; color:var(--muted)}
mark{background:rgba(201,118,27,.3); color:inherit; border-radius:3px; padding:0 1px}

/* spirits table */
.tablewrap{
  overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line-2);
  border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);
}
table{border-collapse:collapse; width:100%; min-width:540px; font-size:14px}
th,td{padding:10px 12px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line-2)}
th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--surface)}
thead th{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
tbody td{font-variant-numeric:tabular-nums; color:var(--ink-2)}
tbody td:first-child{font-weight:500; color:var(--ink)}
tr.grouprow td{
  background:var(--surface-2); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--saffron); font-weight:600; text-align:left;
}
tbody tr:last-child td{border-bottom:0}

/* misc */
.empty{text-align:center; padding:70px 20px; color:var(--muted)}
.empty strong{display:block; font-family:Fraunces,Georgia,serif; font-size:20px; color:var(--ink); margin-bottom:6px}
footer{border-top:1px solid var(--line); padding:32px 16px 48px; text-align:center}
footer .peaks{width:62px; height:26px; margin-bottom:10px}
.fname{font-family:Fraunces,Georgia,serif; letter-spacing:.2em; font-size:15px; color:var(--crimson); font-weight:600}
footer p{margin:7px auto 0; font-size:12.5px; color:var(--muted); max-width:380px}
.pdf{
  display:inline-flex; align-items:center; gap:7px; margin-top:18px; text-decoration:none;
  border:1px solid var(--line); border-radius:999px; padding:9px 17px;
  color:var(--ink-2); font-size:13.5px; font-weight:500; background:var(--surface);
}
.pdf svg{width:15px; height:15px}
.top{
  position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:50;
  width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); box-shadow:var(--shadow); cursor:pointer;
  display:grid; place-items:center; opacity:0; pointer-events:none; transition:opacity .18s;
}
.top.show{opacity:1; pointer-events:auto}
.top svg{width:19px; height:19px}
@media (min-width:640px){
  .list{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  html{scroll-padding-top:158px}
  .lb-img img{max-height:60vh}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} .top{transition:none}}
</style>
</head>

:"veg"},{"name":"Caffè Latte","price":15,"group":"COFFEE · CAFEA","slug":"tea-coffee--caffe-latte","tag":"veg"},{"name":"Flat White","price":15,"group":"COFFEE · CAFEA","slug":"tea-coffee--flat-white","tag":"veg"},{"name":"Milk Tea","price":10,"group":"TEA · CEAI","slug":"tea-coffee--milk-tea-ceai-cu-lapte","nameRo":"Ceai cu lapte","tag":"veg"},{"name":"Black Tea","price":7,"group":"TEA · CEAI","slug":"tea-coffee--black-tea-ceai-negru","nameRo":"Ceai negru","tag":"veg"},{"name":"Hot Lemon","price":8,"group":"TEA · CEAI","slug":"tea-coffee--hot-lemon-lamaie-calda","nameRo":"Lămâie caldă","tag":"veg"},{"name":"Hot Lemon with Honey","price":10,"group":"TEA · CEAI","slug":"tea-coffee--hot-lemon-with-honey-lamaie-calda-cu-miere","nameRo":"Lămâie caldă cu miere","tag":"veg"}],"id":"tea-coffee"},{"title":"Water & Soft Drinks","subtitle":"Apă și răcoritoare","items":[{"name":"Water (Aqua)","portion":"500 ml","price":10,"group":"WATER · APĂ","slug":"water-soft-drinks--water-aqua","tag":"veg"},{"name":"Water (Aqua)","portion":"750 ml","price":12,"group":"WATER · APĂ","slug":"water-soft-drinks--water-aqua-750-ml","tag":"veg"},{"name":"Water (Aqua)","portion":"1L","price":15,"group":"WATER · APĂ","slug":"water-soft-drinks--water-aqua-1l","tag":"veg"},{"name":"Borsec","portion":"500 ml","price":10,"group":"WATER · APĂ","slug":"water-soft-drinks--borsec","tag":"veg"},{"name":"Borsec","portion":"1L","price":15,"group":"WATER · APĂ","slug":"water-soft-drinks--borsec-1l","tag":"veg"},{"name":"Coca-Cola","portion":"330 ml","price":10,"group":"SOFT DRINKS · RĂCORITOARE","slug":"water-soft-drinks--coca-cola","tag":"veg"},{"name":"Coca-Cola Zero","portion":"330 ml","price":10,"group":"SOFT DRINKS · RĂCORITOARE","slug":"water-soft-drinks--coca-cola-zero","tag":"veg"},{"name":"Fanta","portion":"330 ml","price":10,"group":"SOFT DRINKS · RĂCORITOARE","slug":"water-soft-drinks--fanta","tag":"veg"},{"name":"Mountain Dew","portion":"250 ml","price":10,"group":"SOFT DRINKS · RĂCORITOARE","slug":"water-soft-drinks--mountain-dew","tag":"veg"},{"name":"Hell","portion":"250 ml","price":10,"group":"ENERGY DRINKS · BĂUTURI ENERGIZANTE","slug":"water-soft-drinks--hell","tag":"veg"},{"name":"Red Bull","portion":"250 ml","price":15,"group":"ENERGY DRINKS · BĂUTURI ENERGIZANTE","slug":"water-soft-drinks--red-bull","tag":"veg"}],"id":"water-soft-drinks"},{"title":"Beer & Wine","subtitle":"Bere și vin","items":[{"name":"Tuborg","portion":"330 ml","price":12,"group":"BEER · BERE","slug":"beer-wine--tuborg","tag":"veg"},{"name":"Tuborg","portion":"500 ml","price":14,"group":"BEER · BERE","slug":"beer-wine--tuborg-500-ml","tag":"veg"},{"name":"Ursus","portion":"500 ml","price":14,"group":"BEER · BERE","slug":"beer-wine--ursus","tag":"veg"},{"name":"Heineken","portion":"330 ml","price":12,"group":"BEER · BERE","slug":"beer-wine--heineken","tag":"veg"},{"name":"Heineken","portion":"500 ml","price":15,"group":"BEER · BERE","slug":"beer-wine--heineken-500-ml","tag":"veg"},{"name":"Sherpa (Taste of Nepal)","portion":"330 ml","price":16,"group":"BEER · BERE","slug":"beer-wine--sherpa-taste-of-nepal","tag":"veg"},{"name":"Corona","portion":"330 ml","price":12,"group":"BEER · BERE","slug":"beer-wine--corona","tag":"veg"},{"name":"Purcari White","portion":"750 ml","price":140,"group":"WINE · VIN (PURCARI)","slug":"beer-wine--purcari-white-alb","nameRo":"Purcari Alb","tag":"veg"},{"name":"Purcari Red","portion":"750 ml","price":140,"group":"WINE · VIN (PURCARI)","slug":"beer-wine--purcari-red-rosu","nameRo":"Purcari Roșu","tag":"veg"},{"name":"Purcari Rosé","portion":"750 ml","price":140,"group":"WINE · VIN (PURCARI)","slug":"beer-wine--purcari-rose","nameRo":"Purcari Rosé","tag":"veg"}],"id":"beer-wine"},{"title":"Spirits","subtitle":"Băuturi spirtoase · Spirits & liqueurs","items":[],"id":"spirits","table":{"cols":[{"en":"30 ml","ro":"30 ml"},{"en":"60 ml","ro":"60 ml"},{"en":"90 ml","ro":"90 ml"},{"en":"½ bottle","ro":"½ sticlă"},{"en":"Bottle","ro":"Sticlă"}],"groups":[{"name":"WHISKY","rows":[["Johnnie Walker Red Label",25,45,65,175,350],["Jack Daniel's",25,45,65,175,350],["Johnnie Walker Black Label",30,50,65,200,400],["Chivas",30,55,80,200,400],["Jameson",20,35,55,125,250],["Ballantine's",20,35,55,125,250],["J&B",20,35,55,125,250]]},{"name":"VODKA · RUM · LIQUEURS","rows":[["Absolut Vodka",15,25,40,100,200],["Bacardi White Rum",20,35,55,125,250],["Bacardi Red Rum",20,35,55,125,250],["Baileys",20,35,55,125,250],["Tequila · 1 shot",20,null,null,null,null]]}]}}]</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('menu-data').textContent);
var T = {
  ro:{search:'Caută în meniu…', all:'Toate', veg:'Vegetarian', egg:'Cu ou', meat:'Cu carne',
      none:'Nicio potrivire', none2:'Încearcă alt cuvânt sau șterge filtrele.', lei:'lei', item:'Produs'},
  en:{search:'Search the menu…', all:'All', veg:'Vegetarian', egg:'Egg', meat:'Meat',
      none:'No matches', none2:'Try another word or clear the filters.', lei:'lei', item:'Item'}
};
var lang = 'ro', diet = 'all', query = '';
try{ lang = localStorage.getItem('fewa-lang') || 'ro'; }catch(e){}

var qEl = document.getElementById('q');
var main = document.getElementById('main');
var searchWrap = document.getElementById('searchWrap');

function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
// so that "momo" finds "Mo:Mo" and "chow mein" finds "Chowmein"
function key(s){ return norm(s).replace(/[^a-z0-9]+/g,''); }
function hit(hay, nq, kq){
  if(!hay) return false;
  if(norm(hay).indexOf(nq) !== -1) return true;
  return kq.length > 2 && key(hay).indexOf(kq) !== -1;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function hl(s){
  s = String(s==null?'':s);
  if(!query) return esc(s);
  var n = norm(s), nq = norm(query), out = '', i = 0, p;
  if(!nq) return esc(s);
  while((p = n.indexOf(nq, i)) !== -1){
    out += esc(s.slice(i,p)) + '<mark>' + esc(s.slice(p, p+nq.length)) + '</mark>';
    i = p + nq.length;
  }
  return out + esc(s.slice(i));
}
function itemName(it){ return (lang === 'ro' && it.nameRo) ? it.nameRo : it.name; }
function itemDesc(it){ return lang === 'ro' ? (it.ro || '') : (it.en || ''); }
function matches(it, secHit){
  if(diet !== 'all' && it.tag !== diet) return false;
  if(!query || secHit) return true;
  var nq = norm(query), kq = key(query);
  return hit(itemName(it), nq, kq) || hit(it.name, nq, kq)
      || hit(itemDesc(it), nq, kq) || hit(it.portion, nq, kq)
      || hit(it.group, nq, kq);
}

function renderItem(it){
  var portion = it.portion ? ' <span class="portion">' + esc(it.portion) + '</span>' : '';
  var d = itemDesc(it);
  var lead = it.img
    ? '<button class="thumb" type="button" data-t="' + esc(it.tag) + '" data-img="' + esc(it.slug)
      + '" aria-label="' + esc(itemName(it)) + '">'
      + '<img src="images/' + esc(it.img) + '" alt="" loading="lazy" decoding="async"></button>'
    : '<span class="tagdot" data-t="' + esc(it.tag) + '" aria-hidden="true"></span>';
  return '<article class="item' + (it.img ? ' has-img' : '') + '"><div class="item-top">'
    + lead
    + '<h3 class="item-name">' + hl(itemName(it)) + portion + '</h3>'
    + '<span class="price">' + it.price + '<small>' + T[lang].lei + '</small></span>'
    + '</div>' + (d ? '<p class="desc">' + hl(d) + '</p>' : '') + '</article>';
}

function renderTable(sec, secHit){
  if(diet === 'veg' || diet === 'egg') return '';
  var nq = norm(query), kq = key(query);
  var cols = sec.table.cols.map(function(c){ return '<th>' + esc(c[lang]) + '</th>'; }).join('');
  var body = sec.table.groups.map(function(g){
    var rows = g.rows.filter(function(r){ return !nq || secHit || hit(r[0], nq, kq) || hit(g.name, nq, kq); });
    if(!rows.length) return '';
    return '<tr class="grouprow"><td colspan="6">' + esc(g.name) + '</td></tr>'
      + rows.map(function(r){
          return '<tr><td>' + hl(r[0]) + '</td>' + r.slice(1).map(function(v){
            return '<td>' + (v == null ? '—' : v + ' ' + T[lang].lei) + '</td>';
          }).join('') + '</tr>';
        }).join('');
  }).join('');
  if(!body) return '';
  return '<div class="tablewrap"><table><thead><tr><th>' + esc(T[lang].item) + '</th>'
    + cols + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function render(){
  var html = '', visible = [];
  var nq = norm(query), kq = key(query);
  DATA.forEach(function(sec){
    var inner = '';
    // typing a whole category ("dal bhat", "bere", "deserturi") opens that section
    var secHit = !!query && (hit(sec.title, nq, kq) || hit(sec.subtitle, nq, kq));
    if(sec.table){
      inner = renderTable(sec, secHit);
    } else {
      var hits = sec.items.filter(function(it){ return matches(it, secHit); });
      if(hits.length){
        var lastGroup = null, buf = '';
        hits.forEach(function(it){
          if(it.group && it.group !== lastGroup){
            if(buf){ inner += '<div class="list">' + buf + '</div>'; buf = ''; }
            inner += '<div class="group">' + esc(it.group) + '</div>';
            lastGroup = it.group;
          }
          buf += renderItem(it);
        });
        if(buf) inner += '<div class="list">' + buf + '</div>';
      }
    }
    if(!inner) return;
    visible.push(sec);
    html += '<section class="sec" id="' + esc(sec.id) + '">'
      + '<div class="sec-head"><h2>' + esc(sec.title) + '</h2>'
      + (sec.subtitle ? '<p>' + esc(sec.subtitle) + '</p>' : '')
      + '<div class="rule"><i></i><b></b><i></i></div></div>'
      + inner + '</section>';
  });
  main.innerHTML = html || '<div class="empty"><strong>' + T[lang].none + '</strong>' + T[lang].none2 + '</div>';
  document.getElementById('navChips').innerHTML = visible.map(function(s){
    return '<button class="chip" type="button" data-go="' + esc(s.id) + '">' + esc(s.title) + '</button>';
  }).join('');
  observe();
}

function renderDiet(){
  var opts = ['all','veg','egg','meat'];
  document.getElementById('dietChips').innerHTML = opts.map(function(k){
    return '<button class="chip" type="button" data-diet="' + k + '" aria-pressed="' + (diet === k) + '">'
      + (k === 'all' ? '' : '<span class="dot"></span>') + T[lang][k] + '</button>';
  }).join('');
}

var io = null;
function observe(){
  if(io) io.disconnect();
  var chips = [].slice.call(document.querySelectorAll('[data-go]'));
  if(!chips.length || !('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      chips.forEach(function(c){
        var on = c.dataset.go === e.target.id;
        if(on !== c.classList.contains('on')){
          c.classList.toggle('on', on);
          if(on) c.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
        }
      });
    });
  }, {rootMargin:'-156px 0px -68% 0px', threshold:0});
  document.querySelectorAll('.sec').forEach(function(s){ io.observe(s); });
}

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById('lang').innerHTML = (lang === 'ro')
    ? '<b>RO</b><i>·</i><s>EN</s>' : '<s>RO</s><i>·</i><b>EN</b>';
  qEl.placeholder = T[lang].search;
  document.querySelectorAll('[data-ro]').forEach(function(el){
    el.innerHTML = (lang === 'ro') ? el.dataset.ro : el.dataset.en;
  });
  renderDiet();
  render();
}

var SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>';
var MOON = '<path d="M20.5 14.8A8.4 8.4 0 0 1 9.2 3.5 8.6 8.6 0 1 0 20.5 14.8Z"/>';
function curTheme(){
  var t = document.documentElement.getAttribute('data-theme');
  if(t) return t;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function paintTheme(){ document.getElementById('themeIcon').innerHTML = curTheme() === 'dark' ? SUN : MOON; }
try{ var st = localStorage.getItem('fewa-theme'); if(st) document.documentElement.setAttribute('data-theme', st); }catch(e){}
paintTheme();

document.getElementById('theme').addEventListener('click', function(){
  var next = curTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('fewa-theme', next); }catch(e){}
  paintTheme();
});
document.getElementById('lang').addEventListener('click', function(){
  lang = (lang === 'ro') ? 'en' : 'ro';
  try{ localStorage.setItem('fewa-lang', lang); }catch(e){}
  applyLang();
});
var tmr;
qEl.addEventListener('input', function(){
  searchWrap.classList.toggle('has', !!qEl.value);
  clearTimeout(tmr);
  tmr = setTimeout(function(){ query = qEl.value.trim(); render(); }, 110);
});
document.getElementById('clr').addEventListener('click', function(){
  qEl.value = ''; query = ''; searchWrap.classList.remove('has'); render(); qEl.focus();
});
document.getElementById('dietChips').addEventListener('click', function(e){
  var b = e.target.closest('[data-diet]');
  if(!b) return;
  diet = b.dataset.diet; renderDiet(); render();
});
document.getElementById('navChips').addEventListener('click', function(e){
  var b = e.target.closest('[data-go]');
  if(!b) return;
  var el = document.getElementById(b.dataset.go);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
});
/* photo preview */
var BY_SLUG = {};
DATA.forEach(function(s){ (s.items||[]).forEach(function(it){ BY_SLUG[it.slug] = it; }); });
var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
var lastFocus = null;

function openLb(slug){
  var it = BY_SLUG[slug];
  if(!it || !it.img) return;
  lastFocus = document.activeElement;
  lbImg.src = 'images/' + it.img;
  lbImg.alt = itemName(it);
  document.getElementById('lbName').textContent = itemName(it);
  document.getElementById('lbPortion').textContent = it.portion || '';
  document.getElementById('lbPrice').textContent = it.price + ' ' + T[lang].lei;
  document.getElementById('lbDesc').textContent = itemDesc(it);
  lb.classList.add('open');
  document.body.classList.add('lb-on');
  document.getElementById('lbClose').focus();
}
function closeLb(){
  lb.classList.remove('open');
  document.body.classList.remove('lb-on');
  lbImg.removeAttribute('src');
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
main.addEventListener('click', function(e){
  var t = e.target.closest('.thumb');
  if(t) openLb(t.dataset.img);
});
document.getElementById('lbClose').addEventListener('click', closeLb);
lb.addEventListener('click', function(e){ if(e.target === lb || e.target.closest('.lb-img') === null && e.target.closest('.lb-cap') === null) closeLb(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && lb.classList.contains('open')) closeLb(); });

var topBtn = document.getElementById('top');
topBtn.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
window.addEventListener('scroll', function(){ topBtn.classList.toggle('show', window.scrollY > 700); }, {passive:true});

applyLang();
})();
</script>
</body>
</html>
